name: .NET Tests

on:
  push:
    branches: ["main", "lab1"]
  pull_request:
    branches: ["main", "lab1"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'
    
    - name: Run tests
      run: dotnet test